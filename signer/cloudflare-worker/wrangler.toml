name = "glame-ton-signer"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[kv_namespaces]]
binding = "SIGNER_KV"
id = "5f2337d61a4e4d9dbd9c86090a808c50"
preview_id = "5f2337d61a4e4d9dbd9c86090a808c50"

[vars]
TON_NETWORK = "mainnet"
TONCENTER_ENDPOINT = "https://toncenter.com/api/v2/jsonRPC"
TON_GLM_JETTON_MASTER_ADDRESS = "REPLACE_WITH_MAINNET_GLM_JETTON_MASTER"
TON_HOT_WALLET_ADDRESS = "REPLACE_WITH_MAINNET_HOT_WALLET"
TON_WALLET_VERSION = "v5r1"
TON_GLM_DECIMALS = "9"
TX_VALUE_NANOTON = "50000000"
FORWARD_NANOTON = "1"
MAX_AMOUNT_GLM = "1000"
DAILY_LIMIT_GLM = "5000"
EMERGENCY_PAUSED = "false"
