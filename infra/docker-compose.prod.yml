services:
  postgres:
    image: postgres:15-alpine
    container_name: glame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glame_password}
      POSTGRES_DB: ${POSTGRES_DB:-glame_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glame_user} -d ${POSTGRES_DB:-glame_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: glame_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: glame_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: glame_backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-glame_user}:${POSTGRES_PASSWORD:-glame_password}@postgres:5432/${POSTGRES_DB:-glame_db}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      ML_INFERENCE_URL: http://ml_inference:8010
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_inference:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_static:/app/static
      - backend_generated_messages:/app/backend/generated_messages
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  ml_inference:
    build:
      context: ../ml-service
    container_name: glame_ml_inference
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_INFERENCE_HOST_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  backend_generated_messages:
    name: ${BACKEND_GENERATED_MESSAGES_VOLUME_NAME:-infra_backend_generated_messages}
  backend_static:
    name: ${BACKEND_STATIC_VOLUME_NAME:-infra_backend_static}
  backend_uploads:
    name: ${BACKEND_UPLOADS_VOLUME_NAME:-infra_backend_uploads}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-infra_postgres_data}
  qdrant_data:
    name: ${QDRANT_VOLUME_NAME:-infra_qdrant_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-infra_redis_data}
