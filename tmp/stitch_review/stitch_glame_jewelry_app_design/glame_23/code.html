        /* Checkbox styling override for architectural feel */
        input[type="checkbox"] {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 20px;
            height: 20px;
            border: 1px solid #5C6064;
            display: grid;
            place-content: center;
            border-radius: 0;
            cursor: pointer;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
        }
        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
    </style>

<script>
        // Simple micro-interaction for checkboxes to animate numbers (simulated)
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const btn = document.querySelector('footer button');
                // Simulate updating count
                const currentCount = parseInt(btn.textContent.match(/\d+/)[0]);
                const newCount = checkbox.checked ? currentCount - Math.floor(Math.random() * 15) : currentCount + Math.floor(Math.random() * 15);
                btn.textContent = `Показать ${Math.max(1, newCount)} Товаров`;
                
                // Add a subtle flash effect to button
                btn.classList.add('opacity-70');
                setTimeout(() => btn.classList.remove('opacity-70'), 150);
            });
        });
