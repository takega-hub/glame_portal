<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap');
        
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Enforce minimalist architectural constraints */
        * {
            border-radius: 0px !important;
        }
        
        .nav-link {
            transition: color 0.3s ease;
        }
        
        .nav-link:hover {
            color: theme('colors.primary');
        }
        
        .nav-link.active {
            color: theme('colors.primary');
            border-bottom: 1px solid theme('colors.primary');
            padding-bottom: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="h-screen w-full flex flex-col overflow-hidden bg-background">
<!-- Navigation Drawer Overlay (Simulated Full-screen) -->
<div class="fixed inset-0 z-50 flex flex-col bg-surface bg-opacity-95 backdrop-blur-sm h-full w-full max-w-full lg:max-w-md ml-auto border-l border-border-gray">
<!-- Header / Top Bar -->
<header class="flex justify-between items-center w-full px-[28px] h-[56px] border-b border-border-gray shrink-0">
<!-- Invisible spacer for flex balance -->
<div class="w-[24px]"></div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile tracking-tighter text-primary">
                GLAME
            </h1>
<button aria-label="Close menu" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Menu Content Canvas -->
<main class="flex-1 overflow-y-auto px-[28px] py-8 flex flex-col justify-between scrollbar-hide">
<!-- Primary Navigation List -->
<nav class="flex flex-col space-y-6">
<!-- Using generic intent to find active state. "Главная" (Home) is logical for a base drawer view if no specific page is defined -->
<a class="nav-link active font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Главная</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Украшения</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Мой стиль</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Подбор</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Профиль</a>
<div class="h-4"></div> <!-- Structural spacer -->
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Новинки</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Коллекции</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Бренды</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Пространства</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Сервис</a>
<a class="nav-link text-on-surface-variant font-headline-lg-mobile text-headline-lg-mobile w-max" href="#">Сертификат</a>
</nav>
<!-- Secondary Actions (Bottom) -->
<div class="mt-12 pt-8 border-t border-border-gray flex flex-col pb-safe-air-bottom">
<a class="nav-link text-secondary font-body-lg text-body-lg flex items-center space-x-3 w-max group" href="#">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">logout</span>
<span>Вход / Выход</span>
</a>
</div>
</main>
</div>
<!-- Background placeholder to show transparency of the drawer -->
<div class="absolute inset-0 -z-10 bg-surface-container opacity-50 flex items-center justify-center">
