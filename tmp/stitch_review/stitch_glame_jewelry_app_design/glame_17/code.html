            </button>

<script>
        // Micro-interactions and Logic
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('[data-otp-input]');
            const submitBtn = document.getElementById('submit-btn');
            
            // OTP Input Logic
            inputs.forEach((input, index) => {
                // Focus styling hook
                input.addEventListener('focus', () => input.select());
                
                input.addEventListener('input', (e) => {
                    // Restrict to single digit
                    if (input.value.length > 1) {
                        input.value = input.value.slice(0, 1);
                    }
                    
                    // Auto-advance
                    if (input.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    checkCompletion();
                });
                
                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                });
                
                // Prevent non-numeric input
                input.addEventListener('keypress', (e) => {
                    if (!/[0-9]/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });
            
            function checkCompletion() {
                const isComplete = Array.from(inputs).every(input => input.value !== '');
                submitBtn.disabled = !isComplete;
            }
            
            // Focus first input on load
            setTimeout(() => inputs[0].focus(), 300);

            // Timer Logic
            let timeLeft = 59;
            const timerEl = document.getElementById('timer');
            const resendTextEl = document.getElementById('resend-text');
            const resendActionBtn = document.getElementById('resend-action');
            
            const countdown = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerEl.textContent = `00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resendTextEl.classList.add('hidden');
                    resendActionBtn.classList.remove('hidden');
                }
            }, 1000);
            
            // Resend action mock
            resendActionBtn.addEventListener('click', () => {
                // Reset inputs visually
                inputs.forEach(i => i.value = '');
                checkCompletion();
                inputs[0].focus();
                
                // Reset timer visuals
                resendActionBtn.classList.add('hidden');
                resendTextEl.classList.remove('hidden');
                timerEl.textContent = '00:59';
                // Note: In real implementation, restart interval here.
            });
        });
    </script>
