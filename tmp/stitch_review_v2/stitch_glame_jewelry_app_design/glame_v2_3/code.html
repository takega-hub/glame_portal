<script>
        // Simple script to toggle active state on chips for demonstration
        document.querySelectorAll('button').forEach(btn => {
            if(btn.textContent === 'Все' || btn.textContent === 'Кольца' || btn.textContent === 'Серьги' || btn.textContent === 'Колье' || btn.textContent === 'Браслеты' || btn.textContent === 'Каффы') {
                btn.addEventListener('click', function() {
                    // Reset all similar chips
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        if(b.textContent !== 'NEW' && b.textContent !== 'SALE') {
                            b.classList.remove('border-primary', 'text-primary', 'bg-surface-container-high');
                            b.classList.add('border-border-gray', 'text-on-surface-variant');
                        }
                    });
                    // Set active
                    this.classList.remove('border-border-gray', 'text-on-surface-variant');
                    this.classList.add('border-primary', 'text-primary', 'bg-surface-container-high');
                });
            }
        });
        
        // Favorite toggle
        document.querySelectorAll('[aria-label="Add to favorites"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); // prevent card click
                const icon = this.querySelector('span');
                const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                if(!isFilled) {
                    this.classList.remove('text-on-surface-variant');
                    this.classList.add('text-error');
                } else {
                    this.classList.add('text-on-surface-variant');
                    this.classList.remove('text-error');
                }
            });
        });
    </script>
